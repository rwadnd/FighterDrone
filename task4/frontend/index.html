<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>WebSocket CV Stream</title>
   <style>
    body { font-family: Arial, sans-serif; display:flex; gap:16px; padding:16px; }
    #container { display:flex; gap:16px; align-items:flex-start; }
    canvas { background: #000; border-radius:6px; }
    #stats { width:240px; }
    .metric { margin-bottom:8px; }
    .label { color:#aaa; font-size:12px; }
    .value { font-weight:600; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="cv" width="640" height="360"></canvas>

    <div id="stats">
      <div class="metric"><div class="label">Server FPS:</div> <div class="value" id="fps">-</div></div>
      <div class="metric"><div class="label">Latency (ms):</div> <div class="value" id="lat">-</div></div>
      <div class="metric"><div class="label">Bytes/frame:</div> <div class="value" id="size">-</div></div>
      <div class="metric"><div class="label">Status:</div> <div class="value" id="status">connecting...</div></div>
      <div class="metric"><div style="color: red;" class="label">Please wait 20 seconds for the fps to get stable</div>
    </div>
  </div>

<script>
(async () => {
  const ws = new WebSocket("ws://localhost:8765");
  ws.binaryType = "arraybuffer";

  const canvas = document.getElementById("cv");
  const ctx = canvas.getContext("2d");

  const fpsEl = document.getElementById("fps");
  const latEl = document.getElementById("lat");
  const sizeEl = document.getElementById("size");
  const statusEl = document.getElementById("status");

  ws.onopen = () => statusEl.textContent = "connected";
  ws.onclose = () => statusEl.textContent = "disconnected";
  ws.onerror = () => statusEl.textContent = "error";

  ws.onmessage = async (evt) => {
    const arr = evt.data;
    const view = new DataView(arr);

    // ---- READ TIMESTAMP (correct: only 8 bytes) ----
    const server_ts_ms = view.getFloat64(0, true);

    // ---- JPEG BYTES START AT BYTE 8 ----
    const jpeg_bytes = arr.slice(8);
    sizeEl.textContent = jpeg_bytes.byteLength;

    // ---- DECODE JPEG ----
    try {
      const bitmap = await createImageBitmap(
        new Blob([jpeg_bytes], { type: "image/jpeg" })
      );

      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();

      // ---- LATENCY ----
      const latency_ms = Date.now() - server_ts_ms;
      latEl.textContent = latency_ms.toFixed(0);

      // ---- CLIENT SIDE FPS ----
      // (client FPS = render FPS)
      updateFPS();

    } catch (e) {
      console.error("Image decode error:", e);
    }
  };

  // ---- SIMPLE CLIENT FPS METER ----
  let last = performance.now();
  let fpsList = [];

  function updateFPS() {
    const now = performance.now();
    const delta = now - last;
    last = now;

    const fps = 1000 / delta;
    fpsList.push(fps);
    if (fpsList.length > 30) fpsList.shift();

    const avg = fpsList.reduce((a,b)=>a+b,0) / fpsList.length;
    fpsEl.textContent = avg.toFixed(1);
  }

})();
</script>

</body>
</html>
